name: school-tenancy-spike

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: spike
    ports:
      - '127.0.0.1:5440:5432'
    volumes:
      - ./db/bootstrap:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d spike']
      interval: 2s
      timeout: 2s
      retries: 30
